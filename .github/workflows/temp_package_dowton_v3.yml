name: Temporary package DowTon V3

on:
  push:
    branches: [ main ]

jobs:
  package:
    if: contains(github.event.head_commit.message, '[package-dowton-v3]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload requested ZIP
        uses: actions/upload-artifact@v4
        with:
          name: 260920_DowTon_V3_zip
          path: DowTon/260920_DowTon_V3.zip
          if-no-files-found: error

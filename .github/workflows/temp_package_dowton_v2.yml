name: Temporary package DowTon V2

on:
  push:
    branches: [ main ]

jobs:
  package:
    if: contains(github.event.head_commit.message, '[package-dowton-v2]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload requested workbook
        uses: actions/upload-artifact@v4
        with:
          name: 260920_DowTon_V2
          path: DowTon/260920_DowTon_V2.xlsm
          if-no-files-found: error
